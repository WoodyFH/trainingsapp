name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen, Lint und Tests prüfen
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Supabase-Variablen prüfen
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Die Repository-Variablen VITE_SUPABASE_URL und VITE_SUPABASE_ANON_KEY fehlen (Settings > Secrets and variables > Actions, als Variable oder Secret)."
            exit 1
          fi
          node -e '
            const k = process.env.VITE_SUPABASE_ANON_KEY || "";
            let secret = k.startsWith("sb_secret_");
            try { secret ||= JSON.parse(Buffer.from(k.split(".")[1], "base64url").toString()).role === "service_role"; } catch {}
            if (secret) { console.error("::error::VITE_SUPABASE_ANON_KEY ist ein geheimer Schluessel (secret bzw. service_role). Verwende den Publishable- bzw. Anon-Key."); process.exit(1); }
          '

      - name: App bauen
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
